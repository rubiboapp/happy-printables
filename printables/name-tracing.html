<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Name Tracing Worksheet Generator — Happy Printables</title><meta name="description" content="Create a free printable name tracing worksheet for kids."><link rel="stylesheet" href="../style.css"></head><body><header class="print-header no-print"><div class="wrap print-nav"><a class="brand" href="../index.html"><b>★</b> Happy <span>Printables</span></a><a href="../index.html">← Browse all</a></div></header><main class="print-main"><div class="print-title no-print"><span class="eyebrow">FREE GENERATOR</span><h1>Name Tracing Worksheet</h1><p>Type a name, make a worksheet and print it.</p></div><div class="name-form no-print"><input id="name" maxlength="20" placeholder="Type a name, e.g. Emma"><button class="btn" onclick="makeSheet()">Create</button></div><div class="worksheet-shell"><div class="worksheet"><h2 id="title">Trace: Emma</h2><div class="name-lines" id="lines" style="font-size:58px;line-height:1.7;color:#b8bcc5;text-align:center">Emma<br>Emma<br>Emma<br>Emma<br>Emma</div><div style="margin-top:20px;text-align:center;font-weight:800">Now write it by yourself:</div><div style="height:130px;border-bottom:2px solid #202633"></div></div></div><div class="controls no-print"><button class="btn" onclick="window.print()">🖨 Print</button> <a class="btn alt" href="../index.html">← More printables</a></div></main><script>function makeSheet(){let v=(document.getElementById("name").value.trim()||"Emma").replace(/[<>]/g,"").slice(0,20);document.getElementById("title").textContent="Trace: "+v;document.getElementById("lines").innerHTML=Array(5).fill(v).join("<br>")}</script></body></html>
